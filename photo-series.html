  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* ── Cross-document view transition ── */
    @view-transition { navigation: auto; }
    ::view-transition-group(series-hero) {
      animation-duration: 600ms;
      animation-timing-function: cubic-bezier(0.76, 0, 0.24, 1);
    }

    /* ── Series hero ── */
    .series-hero {
      position: relative;
      width: 100%;
      height: 58vh;
      min-height: 320px;
      overflow: hidden;
      margin-top: 58px;
    }
    .series-hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      view-transition-name: series-hero;
    }
    .series-hero-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 2.5rem clamp(1.5rem, 8vw, 7rem) 2rem;
      background: linear-gradient(to top, rgba(26,15,61,.7) 0%, transparent 100%);
      pointer-events: none;
    }
    .series-hero-cat {
      display: block;
      font-size: .58rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.65);
      margin-bottom: .35rem;
    }
    .series-hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 300;
      color: #fff;
      line-height: 1;
    }

    /* ── Masonry grid ── */
    .masonry-grid {
      columns: 3 200px;
      column-gap: .75rem;
      padding: 2rem clamp(1.5rem, 8vw, 7rem) 5rem;
    }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: .75rem;
      cursor: pointer;
      overflow: hidden;
      border-radius: 2px;
      position: relative;
    }
    .masonry-item img {
      width: 100%;
      display: block;
      transition: transform 600ms cubic-bezier(0.76, 0, 0.24, 1);
    }
    .masonry-item:hover img { transform: scale(1.03); }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(10, 5, 25, .96);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 300ms ease;
    }
    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }
    .lb-img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 2px;
      transition: opacity 180ms ease;
    }
    .lb-img.fading { opacity: 0; }
    .lb-close, .lb-prev, .lb-next {
      position: absolute;
      background: rgba(255,255,255,.1);
      border: .5px solid rgba(255,255,255,.18);
      color: rgba(255,255,255,.75);
      cursor: pointer;
      border-radius: 100px;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
    }
    .lb-close:hover, .lb-prev:hover, .lb-next:hover {
      background: rgba(255,255,255,.2);
      color: #fff;
    }
    .lb-close {
      top: 1.25rem;
      right: 1.25rem;
      width: 38px;
      height: 38px;
      font-size: 1.1rem;
      font-family: 'Inter', sans-serif;
    }
    .lb-prev, .lb-next {
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      font-size: 1.8rem;
      line-height: 1;
    }
    .lb-prev { left: 1.25rem; }
    .lb-next { right: 1.25rem; }
    .lb-counter {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: .58rem;
      letter-spacing: .16em;
      color: rgba(255,255,255,.38);
    }

    @media (max-width: 600px) {
      .masonry-grid { columns: 2 140px; }
    }
    @media (max-width: 400px) {
      .masonry-grid { columns: 1; }
    }
  </style>
</head>

<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">

  <button class="lb-prev" id="lbPrev" aria-label="Previous image">‹</button>

  <span class="lb-counter" id="lbCounter"></span>
</div>

<script>
  // ── Series data ──────────────────────────────────────────────────────────────
  const SERIES_DATA = {
    aquarism: {
      title: 'Aquarism',
      category: 'Portrait',
      images: [
        'assets/photography%20/portrait%20/aquarism%20/DSC05015-Edit-2.jpg',
        'assets/photography%20/portrait%20/aquarism%20/DSC05067-Edit.jpg',
        'assets/photography%20/portrait%20/aquarism%20/DSC05070.jpg',
        'assets/photography%20/portrait%20/aquarism%20/DSC05079.jpg',
        'assets/photography%20/portrait%20/aquarism%20/DSC05124.jpg',
        'assets/photography%20/portrait%20/aquarism%20/DSC05133.jpg',
        'assets/photography%20/portrait%20/aquarism%20/Background.jpg',
      ]
    },
    sakura: {
      title: 'Sakura',
      category: 'Portrait',
      images: [
        'assets/photography%20/portrait%20/sakura/48187.JPG',
        'assets/photography%20/portrait%20/sakura/48222.JPG',
        'assets/photography%20/portrait%20/sakura/48226.JPG',
        'assets/photography%20/portrait%20/sakura/48227.JPG',
        'assets/photography%20/portrait%20/sakura/48228.JPG',
        'assets/photography%20/portrait%20/sakura/48232.JPG',
        'assets/photography%20/portrait%20/sakura/48240.JPG',
      ]
    },
    home: {
      title: 'Home',
      category: 'Portrait',
      images: [
        'assets/photography%20/portrait%20/home/DSC04902.jpg',
        'assets/photography%20/portrait%20/home/DSC04903.jpg',
        'assets/photography%20/portrait%20/home/DSC04910.jpg',
        'assets/photography%20/portrait%20/home/DSC04914.jpg',
        'assets/photography%20/portrait%20/home/DSC04917.jpg',
        'assets/photography%20/portrait%20/home/DSC04922.jpg',
        'assets/photography%20/portrait%20/home/DSC04923.jpg',
      ]
    },
    park: {
      title: 'Park',
      category: 'Portrait',
      images: [
        'assets/photography%20/portrait%20/park%20/DSC05176.jpg',
        'assets/photography%20/portrait%20/park%20/DSC05181.jpg',
        'assets/photography%20/portrait%20/park%20/DSC05225-Edit.jpg',
        'assets/photography%20/portrait%20/park%20/DSC05142-Edit,%20heng.jpg',
        'assets/photography%20/portrait%20/park%20/DSC05154-Edit,heng.jpg',
        'assets/photography%20/portrait%20/park%20/DSC05159-Edit,heng.jpg',
        'assets/photography%20/portrait%20/park%20/DSC05170-Edit,heng.jpg',
      ]
    },
    jump: {
      title: 'Jump',
      category: 'Portrait',
      images: [
        'assets/photography%20/portrait%20/jump/DSC00511.jpg',
        'assets/photography%20/portrait%20/jump/DSC00189.jpg',
        'assets/photography%20/portrait%20/jump/DSC00244.jpg',
        'assets/photography%20/portrait%20/jump/DSC00449.jpg',
        'assets/photography%20/portrait%20/jump/DSC00454.jpg',
        'assets/photography%20/portrait%20/jump/DSC00456.jpg',
        'assets/photography%20/portrait%20/jump/DSC00522.jpg',
      ]
    },
    snow: {
      title: 'Snow',
      category: 'Portrait',
      images: [
        'assets/photography%20/portrait%20/snow/DSC00656.jpg',
        'assets/photography%20/portrait%20/snow/DSC00685.jpg',
        'assets/photography%20/portrait%20/snow/DSC00686.jpg',
        'assets/photography%20/portrait%20/snow/DSC00733.jpg',
      ]
    },
    losangeles: {
      title: 'Los Angeles',
      category: 'Landscape',
      images: [
        'assets/photography%20/landscape/losangelas/DSC01878.JPG',
        'assets/photography%20/landscape/losangelas/DSC01972.jpg',
        'assets/photography%20/landscape/losangelas/DSC02012.jpg',
        'assets/photography%20/landscape/losangelas/DSC01805%202.JPG',
        'assets/photography%20/landscape/losangelas/DSC01806%202.JPG',
        'assets/photography%20/landscape/losangelas/DSC01807%202.JPG',
        'assets/photography%20/landscape/losangelas/DSC01809%202.JPG',
      ]
    },
    manhattan: {
      title: 'Manhattan Beach',
      category: 'Landscape',
      images: [
        'assets/photography%20/landscape/manhattan%20beach%20/DSC02072.jpg',
        'assets/photography%20/landscape/manhattan%20beach%20/DSC02126-Edit.jpg',
        'assets/photography%20/landscape/manhattan%20beach%20/DSC02183.jpg',
        'assets/photography%20/landscape/manhattan%20beach%20/DSC02189-Edit.jpg',
        'assets/photography%20/landscape/manhattan%20beach%20/DSC02205.jpg',
        'assets/photography%20/landscape/manhattan%20beach%20/DSC02206.jpg',
      ]
    }
  };

  // ── Init page from URL param ─────────────────────────────────────────────────
  const seriesKey = new URLSearchParams(location.search).get('series') || 'aquarism';
  const series    = SERIES_DATA[seriesKey] || SERIES_DATA.aquarism;

  document.title = series.title + ' · Photography — Sunlei Jin';
  document.getElementById('heroCat').textContent   = series.category;
  document.getElementById('heroTitle').textContent = series.title;

  const heroImg = document.getElementById('heroImg');
  heroImg.src = series.images[0];
  heroImg.alt = series.title;

  // ── Build masonry grid ───────────────────────────────────────────────────────
  const grid = document.getElementById('masonryGrid');
  series.images.forEach((src, i) => {
    const item = document.createElement('div');
    item.className = 'masonry-item';
    const img = document.createElement('img');
    img.src     = src;
    img.alt     = series.title + ' ' + (i + 1);
    img.loading = 'lazy';
    item.appendChild(img);
    item.addEventListener('click', () => openLb(i));
    grid.appendChild(item);
  });

  // ── Lightbox ─────────────────────────────────────────────────────────────────
  const lb        = document.getElementById('lb');
  const lbImg     = document.getElementById('lbImg');
  const lbCounter = document.getElementById('lbCounter');
  let lbIndex     = 0;

  function showLbImage() {
    lbImg.classList.add('fading');
    const tmp   = new Image();
    tmp.onload  = () => {
      lbImg.src = series.images[lbIndex];
      lbImg.classList.remove('fading');
    };
    tmp.onerror = () => {
      lbImg.src = series.images[lbIndex];
      lbImg.classList.remove('fading');
    };
    tmp.src = series.images[lbIndex];
    lbCounter.textContent = (lbIndex + 1) + ' / ' + series.images.length;
  }

  function openLb(idx) {
    lbIndex = idx;
    lbImg.src = series.images[idx];
    lbCounter.textContent = (idx + 1) + ' / ' + series.images.length;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLb() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }

  function prevLb() { lbIndex = (lbIndex - 1 + series.images.length) % series.images.length; showLbImage(); }
  function nextLb() { lbIndex = (lbIndex + 1) % series.images.length; showLbImage(); }

  document.getElementById('lbClose').addEventListener('click', closeLb);
  document.getElementById('lbPrev').addEventListener('click', prevLb);
  document.getElementById('lbNext').addEventListener('click', nextLb);
  lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });

  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape')      closeLb();
    else if (e.key === 'ArrowLeft')  prevLb();
    else if (e.key === 'ArrowRight') nextLb();
  });

  // Touch swipe in lightbox
  let lbTX = 0;
  lb.addEventListener('touchstart', e => { lbTX = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', e => {
    const d = lbTX - e.changedTouches[0].clientX;
    if (d > 50)  nextLb();
    else if (d < -50) prevLb();
  }, { passive: true });

  // ── Page transitions ─────────────────────────────────────────────────────────
  window.addEventListener('load', () => document.body.classList.add('loaded'));

  document.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href') || '';
    if (!href.startsWith('#') && !href.startsWith('mailto') && !href.startsWith('tel') && !href.startsWith('http')) {
      a.addEventListener('click', e => {
        e.preventDefault();
        document.body.classList.remove('loaded');
        setTimeout(() => location.href = href, 340);
      });
    }
  });

  document.getElementById('ham').addEventListener('click', () => {
    document.getElementById('navlinks').classList.toggle('open');
  });
</script>
</body>
